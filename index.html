<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PRIGON Calculator</title><style>
:root{--bg:#f5f6f8;--card:#fff;--text:#17191d;--muted:#6b7280;--line:#e5e7eb;--accent:#d71920;--dark:#111318;--green:#0a8f4d}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:var(--bg);color:var(--text)}header{background:var(--dark);color:#fff;padding:20px 5vw;display:flex;align-items:center;justify-content:space-between}.brand{font-size:24px;font-weight:900;letter-spacing:.5px}.brand span{color:var(--accent)}.toggle button{border:1px solid #444;background:#222;color:#ddd;padding:9px 14px;cursor:pointer}.toggle button.active{background:var(--accent);border-color:var(--accent);color:#fff}.wrap{max-width:1250px;margin:26px auto;padding:0 18px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:end;margin-bottom:18px}.hero h1{margin:0;font-size:28px}.hero p{margin:6px 0 0;color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden}.card h2{font-size:17px;margin:0;padding:16px 18px;border-bottom:1px solid var(--line)}.rows{padding:8px 18px}.row{display:grid;grid-template-columns:1fr 130px 115px 130px;gap:10px;align-items:center;padding:9px 0;border-bottom:1px dashed #eee}.row:last-child{border:0}.row label{font-size:14px}.head{font-size:11px;color:var(--muted);text-transform:uppercase}.money{position:relative}.money:before{content:'$';position:absolute;left:10px;top:9px;color:#777}.money input{padding-left:24px}input,select{width:100%;height:36px;border:1px solid #d8dbe0;border-radius:7px;padding:0 9px;background:#fff;font-size:14px}.readonly input{background:#f3f4f6}.total{display:flex;justify-content:space-between;padding:14px 18px;background:#fafafa;border-top:1px solid var(--line);font-weight:800}.summary{margin-top:18px;background:var(--dark);color:#fff;border-radius:14px;padding:20px;display:grid;grid-template-columns:repeat(4,1fr) 1.2fr;gap:14px}.summary .s{border-right:1px solid #333;padding-right:12px}.summary .s:last-child{border:0}.summary small{display:block;color:#aaa;margin-bottom:5px}.summary strong{font-size:21px}.summary .grand strong{font-size:30px;color:#fff}.note{font-size:12px;color:var(--muted);margin-top:12px}.client .managerOnly{display:none}.client .row{grid-template-columns:1fr 150px}.client .head.base,.client .head.adjust{display:none}.client .clientHead{display:block!important}.clientPrice input{font-weight:700;color:var(--green)}@media(max-width:850px){.grid{grid-template-columns:1fr}.row{grid-template-columns:1fr 90px 85px 100px}.summary{grid-template-columns:1fr 1fr}.hero{display:block}.toggle{margin-top:14px}}
</style></head><body><header><div class="brand">PRIGON<span>.UA</span> — CALCULATOR</div><div class="toggle"><button id="managerBtn" class="active">Менеджер</button><button id="clientBtn">Клиент</button></div></header><main class="wrap" id="app"><div class="hero"><div><h1>Расчёт стоимости автомобиля</h1><p>Рабочая версия v0.2 — все суммы в USD</p></div></div><div class="grid" id="cards"></div><div class="summary"><div class="s"><small>Платёж №1</small><strong id="s1">$0</strong></div><div class="s"><small>Платёж №2</small><strong id="s2">$0</strong></div><div class="s"><small>Платёж №3</small><strong id="s3">$0</strong></div><div class="s"><small>Платёж №4</small><strong id="s4">$0</strong></div><div class="s grand"><small>ИТОГО БЕЗ РЕМОНТА</small><strong id="grand">$0</strong></div></div><div class="note">Перевод средств рассчитывается автоматически: 3% × (платёж №1 + расходы блока №2 до перевода) + $100. В расчёт берутся цены для клиента.</div></main><script>
const blocks=[{title:'1. Аукцион',auctionSelect:true,rows:[['car','Выигрышная ставка',4000],['auction','Аукционный сбор',1318]]},{title:'2. США → Клайпеда',rows:[['land','Суша',440],['sea','Море',825],['docs','Оформление документов',0],['transfer','Перевод средств',0,true]]},{title:'3. Европа → Украина',rows:[['forward','Экспедирование',400],['broker','Брокер',150],['carrier','Автовоз',1100]]},{title:'4. Таможня + услуги',rows:[['customs','Официальные таможенные платежи',0],['pension','Первая регистрация / пенсионный фонд',0],['services','Услуги компании',500]]}];
const state={};const cards=document.getElementById('cards');
blocks.forEach((b,bi)=>{let html=`<section class="card"><h2>${b.title}</h2><div class="rows">${b.auctionSelect?`<div style="padding:10px 0 14px;border-bottom:1px dashed #eee"><label for="auction-house" style="display:block;font-size:14px;font-weight:700;margin-bottom:7px">Аукцион</label><select id="auction-house"><option value="COPART">COPART</option><option value="IAAI">IAAI</option></select></div>`:''}<div class="row head"><span>Статья</span><span class="base managerOnly">База</span><span class="adjust managerOnly">± Корр.</span><span class="clientHead">Клиент</span></div>`;b.rows.forEach(r=>{state[r[0]]={base:r[2],adj:0,auto:!!r[3]};html+=`<div class="row"><label>${r[1]}</label><div class="money managerOnly ${r[3]?'readonly':''}"><input data-id="${r[0]}" data-kind="base" type="number" value="${r[2]}" ${r[3]?'readonly':''}></div><div class="money managerOnly ${r[3]?'readonly':''}"><input data-id="${r[0]}" data-kind="adj" type="number" value="0" ${r[3]?'readonly':''}></div><div class="money clientPrice readonly"><input id="client-${r[0]}" readonly></div></div>`});html+=`</div><div class="total"><span>Платёж №${bi+1}</span><span id="b${bi+1}">$0</span></div></section>`;cards.insertAdjacentHTML('beforeend',html)});
function val(id){return state[id].base+state[id].adj}function fmt(n){return '$'+n.toLocaleString('en-US',{minimumFractionDigits:Number.isInteger(n)?0:2,maximumFractionDigits:2})}
function calc(){const pre2=val('land')+val('sea')+val('docs');state.transfer.base=Math.round((.03*(val('car')+val('auction')+pre2)+100)*100)/100;state.transfer.adj=0;for(const id in state)document.getElementById('client-'+id).value=(val(id)).toFixed(Number.isInteger(val(id))?0:2);const totals=[val('car')+val('auction'),pre2+val('transfer'),val('forward')+val('broker')+val('carrier'),val('customs')+val('pension')+val('services')];totals.forEach((x,i)=>{document.getElementById('b'+(i+1)).textContent=fmt(x);document.getElementById('s'+(i+1)).textContent=fmt(x)});document.getElementById('grand').textContent=fmt(totals.reduce((a,b)=>a+b,0));document.querySelector('[data-id="transfer"][data-kind="base"]').value=state.transfer.base}
document.addEventListener('input',e=>{if(!e.target.dataset.id)return;state[e.target.dataset.id][e.target.dataset.kind]=Number(e.target.value)||0;calc()});const auctionHouse=document.getElementById('auction-house');if(auctionHouse){auctionHouse.addEventListener('change',()=>{document.documentElement.dataset.auction=auctionHouse.value})}
document.getElementById('managerBtn').onclick=()=>{app.classList.remove('client');managerBtn.classList.add('active');clientBtn.classList.remove('active')};document.getElementById('clientBtn').onclick=()=>{app.classList.add('client');clientBtn.classList.add('active');managerBtn.classList.remove('active')};calc();
</script></body></html>
